name: Research NHL Totals 15 UTC
on:
  schedule:
    - cron: '7 15 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Research capture operation
        type: choice
        default: probe
        options: [probe, capture, health]
permissions:
  contents: write
concurrency:
  group: odds-data-writer
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Validate collector
        run: python -m unittest discover -s research -p 'test_totals_capture.py' -v
      - name: Capture fixed as-of totals
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          CAPTURE_MODE: ${{ github.event_name == 'schedule' && 'capture' || inputs.mode }}
        run: python research/totals_capture.py "$CAPTURE_MODE" --root data/nhl_totals_15utc
      - name: Preserve research archive and status
        if: always()
        run: |
          if [ -d data/nhl_totals_15utc ]; then
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git add data/nhl_totals_15utc/
            if ! git diff --staged --quiet; then
              git commit -m "Archive research NHL totals capture"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
