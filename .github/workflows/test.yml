name: Test

on:
  push:
    paths-ignore:
      - 'data/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install .
      - name: Run tests
        run: python -m unittest discover -s tests -v
