name: Fetch Football Odds Snapshot

on:
  schedule:
    # Daily baseline, offset from both the top of the hour and the NHL/WNBA job.
    - cron: '47 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: odds-data-writer
  cancel-in-progress: false

jobs:
  fetch-football:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0

      - name: Install dependencies
        run: uv sync

      - name: Fetch NFL and college football snapshot
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_SNAPSHOT_LABEL: football
          ODDS_SPORTS: americanfootball_nfl,americanfootball_ncaaf
        run: uv run python fetch_odds.py

      - name: Commit and push if changes
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          git diff --staged --quiet || git commit -m "Add football odds snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase origin main
          git push
